# Publica a API na VPS. SÓ isso: nenhum teste roda aqui (decisão de 2026-11-01, para ganhar velocidade). A validação é à mão:
# `npm test` na máquina de quem desenvolve, quando quiser. A rede de segurança de produção é a própria VPS: o build da
# imagem compila com tsc (erro de tipo derruba o build e nada muda no que está no ar), o `migrate` roda antes da API, o
# /saude confere o banco e, se falhar, o script volta a imagem e o commit anteriores.
#
# Dispara em push na main SÓ quando muda o que entra na imagem da API ou como ela sobe (lista em `paths`). Mudar teste,
# documentação, coleções ou workflow não publica. Infra (compose, Dockerfile, db/, scripts/deploy, .env.producao.example)
# continua na lista de propósito: o script da VPS recusa (código 2) e o job fica vermelho, avisando que esse deploy é manual
# (docs/deploy.md, seção 11). Execução à mão: aba Actions > Run workflow (publica o que está na origin/main).
#
# O que roda na VPS: SSH com a chave do CI, que no servidor só executa /usr/local/sbin/tcc-portaria-deploy
# (scripts/deploy/deploy-vps.sh): fetch da origin/main, backup, build, migrate, /saude e rollback da imagem se falhar. O
# workflow não manda comando nem commit: a VPS sempre sobe a origin/main que ela mesma busca.
#
# Configuração (só o dono do repositório; ver README.md, "Publicar"):
#   variáveis do repositório: DEPLOY_HOST (IP da VPS) e DEPLOY_KNOWN_HOSTS (linha do known_hosts, fixa a chave do host)
#   environment `producao`, restrito ao branch main: secret DEPLOY_SSH_KEY (chave privada do CI)
# Sem DEPLOY_HOST o job é pulado sem falhar.
name: Publicar a API na VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'drizzle-plataforma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'drizzle.config.ts'
      - 'drizzle-plataforma.config.ts'
      - 'scripts/migrar-bancos.mjs'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'db/**'
      - 'scripts/deploy/**'
      - '.env.producao.example'
  workflow_dispatch:

permissions: {}

# Uma publicação por vez; as seguintes esperam na fila (só a mais recente fica) e NUNCA se cancela uma em andamento.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: producao
    permissions: {}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Deploy na VPS
        run: |
          if [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::faltam DEPLOY_KNOWN_HOSTS (variável) ou DEPLOY_SSH_KEY (secret do environment producao)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave do host fica fixada: nada de accept-new. O comando remoto é ignorado pelo servidor (forced command).
          # Código 255 do ssh em menos de 40 s é falha de CONEXÃO (timeout de rede do runner, já visto em 2026-11-02): nada
          # rodou na VPS, então tentar de novo é seguro. Demorou mais que isso, o script pode ter rodado até a metade: não repete.
          for tentativa in 1 2 3; do
            inicio=$SECONDS
            codigo=0
            ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=30 "root@$DEPLOY_HOST" deploy || codigo=$?
            if [ "$codigo" = 255 ] && [ $((SECONDS - inicio)) -lt 40 ] && [ "$tentativa" -lt 3 ]; then
              echo "::warning::sem conexão com a VPS (tentativa $tentativa de 3); aguardando 20 s"
              sleep 20
              continue
            fi
            break
          done
          duracao=$((SECONDS - inicio))
          case "$codigo" in
            0) ;;
            3) echo "::error::A VPS não tem commit publicado válido, ou o clone diverge dele. Nada foi alterado. Conferir e semear: docs/deploy.md, seção 11." ;;
            4) echo "::error::A publicação falhou e o ROLLBACK também: a produção pode estar fora. Intervir na VPS agora." ;;
            5) echo "::error::A API foi publicada, mas o estado não foi gravado na VPS. Gravar à mão (docs/deploy.md, seção 11)." ;;
            2) echo "::error::A VPS RECUSOU a publicação: o intervalo de commits muda infra (compose, Dockerfile, db/bootstrap, db/backup, scripts/deploy ou .env.producao.example) ou a main foi reescrita. Publicar à mão: docs/deploy.md, seção 11. A API NÃO foi atualizada." ;;
            75) echo "::error::Outra publicação está em andamento na VPS. Aguardar e conferir /saude; só então rodar de novo." ;;
            255) if [ "$duracao" -lt 40 ]; then
                   echo "::error::Sem conexão SSH com a VPS; nada deve ter rodado. Use Re-run failed jobs."
                 else
                   echo "::error::A conexão caiu com a publicação em curso; ela CONTINUA na VPS. Conferir /saude e journalctl -u 'tcc-portaria-deploy-*'. Rodar de novo é seguro (dá 75 ou nada a fazer)."
                 fi ;;
            *) echo "::error::A publicação falhou na VPS (código $codigo). O script volta a imagem anterior; migração aplicada não volta (ver o log acima e docs/deploy.md, seção 11)." ;;
          esac
          exit "$codigo"
      - name: Apagar a chave do runner
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy
