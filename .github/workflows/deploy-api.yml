# Publica a API na VPS. SÓ isso: nenhum teste roda aqui (decisão de 2026-11-01, para ganhar velocidade). A validação é à mão:
# `npm test` na máquina de quem desenvolve, quando quiser. A rede de segurança de produção é a própria VPS: o build da
# imagem compila com tsc (erro de tipo derruba o build e nada muda no que está no ar), o `migrate` roda antes da API, o
# /saude confere o banco e, se falhar, o script volta a imagem e o commit anteriores.
#
# Dispara em push na main SÓ quando muda o que entra na imagem da API ou como ela sobe (lista em `paths`). Mudar teste,
# documentação, coleções ou workflow não publica. Infra (compose, Dockerfile, db/, scripts/deploy, .env.producao.example)
# continua na lista de propósito: o script da VPS recusa (código 2) e o job fica vermelho, avisando que esse deploy é manual
# (docs/deploy.md, seção 11). Execução à mão: aba Actions > Run workflow (publica o que está na origin/main).
#
# O que roda na VPS: SSH com a chave do CI, que no servidor só executa /usr/local/sbin/tcc-portaria-deploy
# (scripts/deploy/deploy-vps.sh): fetch da origin/main, backup, build, migrate, /saude e rollback da imagem se falhar. O
# workflow não manda comando nem commit: a VPS sempre sobe a origin/main que ela mesma busca.
#
# Configuração (só o dono do repositório; ver README.md, "Publicar"):
#   variáveis do repositório: DEPLOY_HOST (IP da VPS) e DEPLOY_KNOWN_HOSTS (linha do known_hosts, fixa a chave do host)
#   environment `producao`, restrito ao branch main: secret DEPLOY_SSH_KEY (chave privada do CI)
# Sem DEPLOY_HOST o job é pulado sem falhar.
name: Publicar a API na VPS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'drizzle/**'
      - 'drizzle-plataforma/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'drizzle.config.ts'
      - 'drizzle-plataforma.config.ts'
      - 'scripts/migrar-bancos.mjs'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - 'db/**'
      - 'scripts/deploy/**'
      - '.env.producao.example'
  workflow_dispatch:

permissions: {}

# Uma publicação por vez; as seguintes esperam na fila (só a mais recente fica) e NUNCA se cancela uma em andamento.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: producao
    permissions: {}
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Deploy na VPS
        run: |
          if [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::faltam DEPLOY_KNOWN_HOSTS (variável) ou DEPLOY_SSH_KEY (secret do environment producao)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # A chave do host fica fixada: nada de accept-new. O comando remoto é ignorado pelo servidor (forced command).
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "root@$DEPLOY_HOST" deploy
      - name: Apagar a chave do runner
        if: ${{ always() }}
        run: rm -f ~/.ssh/deploy
